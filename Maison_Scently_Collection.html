<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maison Scently — Aperçu interactif</title>
  <style>
    :root{--navy:#041836;--deep:#061a32;--gold:#d9b66c;--ivory:#faf7f0;--ink:#15243a;--muted:#68645f;--line:#dfd7c8;--serif:Georgia,'Times New Roman',serif}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #a36d1c;outline-offset:4px}
    h1,h2,h3,p{margin:0}
    h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.13}
    h1{font-size:clamp(44px,6vw,88px);letter-spacing:-.045em}
    h2{font-size:clamp(36px,4.4vw,64px);letter-spacing:-.035em}
    h3{font-size:24px}
    em{font-weight:400}
    img{max-width:100%;display:block}
    .announcement{text-align:center;background:#020f25;color:#dec38d;padding:9px 16px;font-size:10px;letter-spacing:.22em}
    .announcement span{padding:0 12px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:36px;background:#061a36;color:#f9f2e5;padding:19px 5.5%;border-bottom:1px solid #bfa66a38}
    .brand{width:235px;flex-shrink:0}
    .brand img{width:100%;height:auto}
    .header nav{display:flex;gap:clamp(20px,3.2vw,48px);font-size:13px;align-items:center}
    .header nav a:hover,.discover:hover{color:var(--gold)}
    .discover{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
    .hero{display:grid;grid-template-columns:1fr 1fr;background:#061a36;color:var(--ivory);min-height:650px}
    .hero-copy{padding:clamp(55px,8vw,115px) 8% 44px 11%;display:flex;align-items:flex-start;flex-direction:column;justify-content:center}
    .eyebrow{font:600 10px/1.5 Arial,sans-serif;letter-spacing:.20em;color:#76603b;text-transform:uppercase}
    .gold{color:var(--gold)}
    .hero h1{margin:25px 0 23px}
    .hero h1 em{color:var(--gold);display:block}
    .hero-description{color:#dedee0;font-size:16px;max-width:410px;line-height:1.8;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:18px;background:var(--gold);color:#071b36;font-size:12px;letter-spacing:.05em;font-weight:600;padding:16px 25px;min-height:52px;border:1px solid var(--gold);cursor:pointer;transition:background .2s}
    .btn:hover:not(:disabled){background:#ebcc8a}
    .btn:disabled{cursor:not-allowed;opacity:.65}
    .hero-index{color:#aaaeb9;font-size:9px;letter-spacing:.20em;margin-top:65px}
    .hero-photo{position:relative;overflow:hidden;min-height:570px}
    .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 54%;position:absolute;inset:0}
    .hero-photo>span{position:absolute;bottom:20px;right:24px;color:#f8e8c6;letter-spacing:.16em;font-size:9px}
    .benefits{display:grid;grid-template-columns:repeat(3,1fr);padding:25px 6%;background:#f1ece2;border-bottom:1px solid var(--line)}
    .benefits>div{display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;border-right:1px solid var(--line)}
    .benefits>div:last-child{border:0}
    .benefits svg{width:20px;color:#9d793e;stroke-width:1.3}
    .section{padding:75px 6%;max-width:1600px;margin:auto}
